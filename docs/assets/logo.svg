<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- The glyph of docs/assets/favicon.svg without its green plate: the header
         already carries a colour of its own, and a plate on it would be a
         second box inside the bar.

         The stroke is the literal white and not currentColor, because Material
         embeds the logo with an img tag. Inside an img the SVG is a document of
         its own, so there is no inherited colour to pick up and currentColor
         falls back to the black canvas text colour. -->
    <rect x="3" y="2" width="18" height="5" rx="1.5" />
        <rect x="3" y="17" width="18" height="5" rx="1.5" />
        <path d="M2 12h5l2-2.5 3 5 2-2.5h8" />
        <path d="M7 4.5h.01M7 19.5h.01" />
</svg>
