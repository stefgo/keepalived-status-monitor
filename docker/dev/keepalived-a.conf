# Development cluster for compose.dev.yaml: node a of two. Unicast rather than
# multicast, so the pair works on any Docker bridge. Each node is MASTER of one of the two
# virtual routers, which gives the dashboard two clusters to show and a failover in both
# directions when one node is stopped.

# Node a tells its agent about state changes through the notify FIFO (the agent's
# KASM_NOTIFY_FIFO in compose.dev.yaml); node b does it through the notify script.
global_defs {
    router_id kasm-dev-a
    vrrp_notify_fifo /run/kasm-notify.fifo
}

# Failover on demand: `docker exec kasm-keepalived-a sh -c 'echo 1 > /tmp/kasm-fault'`
# puts this node's instances into FAULT, `echo 0` into the same file brings them back.
# Stopping the container would take the agent with it -- it shares this node's namespaces.
track_file kasm_fault {
    file /tmp/kasm-fault
    weight 0
    init_file 0
}

vrrp_sync_group VG_DEV {
    group {
        VI_WEB
    }
}

vrrp_instance VI_WEB {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    unicast_src_ip 172.28.0.11
    unicast_peer {
        172.28.0.12
    }
    authentication {
        auth_type PASS
        # Never leaves the host: the agent reads only the fields it names.
        auth_pass kasmdev
    }
    virtual_ipaddress {
        172.28.0.100/24
    }
    track_file {
        kasm_fault
    }
}

vrrp_instance VI_DB {
    state BACKUP
    interface eth0
    virtual_router_id 52
    priority 100
    advert_int 1
    unicast_src_ip 172.28.0.11
    unicast_peer {
        172.28.0.12
    }
    virtual_ipaddress {
        172.28.0.200/24
    }
    track_file {
        kasm_fault
    }
}
