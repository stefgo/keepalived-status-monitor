services:
    kasm-server:
        container_name: kasm-server
        build:
            context: .
            dockerfile: docker/Dockerfile.server
        image: kasm-server:latest
        ports:
            - "3010:3010"
        volumes:
            # Persist SQLite database and other data
            - server-data:/app/server/backend/data
            # Persist configuration (ensure this file exists or is created)
            - ./server-config.yaml:/app/server/config.yaml
        restart: unless-stopped
        environment:
            - NODE_ENV=production
        # Repeats the image's HEALTHCHECK so it is visible in the file operators edit.
        # Docker does NOT restart an unhealthy container -- `restart:` reacts to the process
        # exiting. The state shows in `docker ps` and works with
        # `depends_on: condition: service_healthy`.
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.KASM_SERVER_PORT || 3010) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3

    kasm-client:
        container_name: kasm-client
        build:
            context: .
            dockerfile: docker/Dockerfile.client
        image: kasm-client:latest
        # The agent runs on the host that runs keepalived and reads it from there:
        # - pid: host lets it see keepalived's process and signal it (SIGUSR1/SIGUSR2),
        #   which is how keepalived is asked to write its state.
        # - SYS_PTRACE lets it read that state through /proc/<pid>/root, keepalived's own
        #   view of the file system -- so a systemd PrivateTmp=true makes no difference.
        # - AppArmor's docker-default profile forbids reading another process's root even
        #   with the capability, hence unconfined.
        # - network_mode: host keeps the agent's web port reachable under the host's
        #   address, which outbound mode dials. Move it with KASM_CLIENT_PORT.
        #
        # This is NOT isolation from the host. SYS_PTRACE works on every process in the host
        # PID namespace, not just keepalived: /proc/1/root is the host's whole file system,
        # and the container's root is the host's root, so root-owned host files are readable
        # and writable through it. Treat the agent as root on the host and keep its web port
        # small (allowedNetworks, pages disabled once registered).
        #
        # What can be taken away is:
        # - cap_drop: ALL leaves nothing but the two capabilities above. Gone are, among
        #   others, NET_RAW (forged VRRP or ARP on the host network), DAC_OVERRIDE (files of
        #   other users), CHOWN, SETUID and MKNOD. Without DAC_OVERRIDE the agent can write
        #   client-config.yaml only if the file belongs to root (`sudo chown root:
        #   client-config.yaml`). What that costs is small: the identity from registration
        #   goes to the data volume below, and this file is written only to store the
        #   serverUrl of a web-UI registration or to clear a used registrationSecret.
        # - no-new-privileges stops setuid binaries from raising privileges again.
        # - read_only: the agent writes config.yaml and its data volume, nothing else.
        network_mode: host
        pid: host
        cap_drop:
            - ALL
        cap_add:
            - KILL
            - SYS_PTRACE
        security_opt:
            - apparmor:unconfined
            - no-new-privileges:true
        read_only: true
        tmpfs:
            - /tmp
        volumes:
            # Persist client configuration
            - ./client-config.yaml:/app/client/config.yaml
            # The agent's own state: the identity it was issued at registration, its last
            # keepalived reading, so a restart still notices a failover that happened
            # meanwhile, and activity events the server has not acknowledged yet. Losing this
            # volume means registering the agent again.
            # A named volume, and it has to stay one -- the line above is a
            # single-file bind mount, so anything written beside config.yaml lives in the
            # container and is gone with the next recreate. KASM_CLIENT_DATA_DIR moves the
            # directory for an agent that runs outside compose.
            - client-data:/app/client/data
        restart: unless-stopped
        environment:
            - NODE_ENV=production
            # Let keepalived report a failover at once instead of at the next 5-second poll
            # (docs/install.md, "Faster Failover Detection"): its vrrp_notify_fifo, and/or the
            # token its notify script presents. Both unset by default.
            # - KASM_NOTIFY_FIFO=/run/kasm-notify.fifo
            # - KASM_NOTIFY_TOKEN=<contents of /etc/keepalived/kasm-notify.token>
        # Reports on the agent, not on its server connection or on keepalived: an agent that
        # cannot reach the server, or reports keepalived as stopped, is still healthy. If this
        # agent's config.yaml disables the web server (enableStatusPage and enableRegisterPage
        # false, no outbound mode), replace this block with `healthcheck: { disable: true }`.
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3

volumes:
    server-data:
    client-data:
